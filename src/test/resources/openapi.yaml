openapi: 3.0.3
info:
  title: JSONPlaceholder API
  description: API ficticia de JSONPlaceholder usada como referencia para los contratos de automatización
  version: 1.0.0
  contact:
    url: https://jsonplaceholder.typicode.com

servers:
  - url: https://jsonplaceholder.typicode.com
    description: Servidor principal de JSONPlaceholder

paths:
  /posts:
    get:
      summary: Listar todas las publicaciones
      operationId: listarPublicaciones
      tags: [posts]
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Lista de publicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

    post:
      summary: Crear una publicación
      operationId: crearPublicacion
      tags: [posts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Publicación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

  /posts/{id}:
    get:
      summary: Obtener una publicación por ID
      operationId: obtenerPublicacion
      tags: [posts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Publicación encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

    put:
      summary: Actualizar una publicación
      operationId: actualizarPublicacion
      tags: [posts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '200':
          description: Publicación actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

    delete:
      summary: Eliminar una publicación
      operationId: eliminarPublicacion
      tags: [posts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Publicación eliminada

  /users:
    get:
      summary: Listar todos los usuarios
      operationId: listarUsuarios
      tags: [users]
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      summary: Obtener un usuario por ID
      operationId: obtenerUsuario
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    delete:
      summary: Eliminar un usuario
      operationId: eliminarUsuario
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario eliminado

components:
  schemas:
    Post:
      type: object
      required: [userId, id, title, body]
      properties:
        userId:
          type: integer
          description: ID del usuario propietario de la publicación
        id:
          type: integer
          description: ID único de la publicación
        title:
          type: string
          description: Título de la publicación
        body:
          type: string
          description: Contenido de la publicación

    PostInput:
      type: object
      required: [userId, title, body]
      properties:
        userId:
          type: integer
        title:
          type: string
        body:
          type: string

    User:
      type: object
      required: [id, name, username, email]
      properties:
        id:
          type: integer
          description: ID único del usuario
        name:
          type: string
          description: Nombre completo del usuario
        username:
          type: string
          description: Nombre de usuario
        email:
          type: string
          format: email
          description: Correo electrónico del usuario
        address:
          $ref: '#/components/schemas/Address'
        phone:
          type: string
          description: Número de teléfono
        website:
          type: string
          description: Sitio web del usuario
        company:
          $ref: '#/components/schemas/Company'

    Address:
      type: object
      properties:
        street:
          type: string
        suite:
          type: string
        city:
          type: string
        zipcode:
          type: string
        geo:
          type: object
          properties:
            lat:
              type: string
            lng:
              type: string

    Company:
      type: object
      properties:
        name:
          type: string
        catchPhrase:
          type: string
        bs:
          type: string
